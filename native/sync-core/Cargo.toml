[package]
name = "memcloud_sync_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
automerge = "0.6.1"
base64 = "0.22.1"
chacha20poly1305 = { version = "0.10.1", features = ["std"] }
once_cell = "1.19.0"
rand = "0.8.5"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
sha2 = "0.10.8"
tungstenite = "0.23.0"
url = "2.5.0"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"